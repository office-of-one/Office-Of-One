<title>Office of One Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@700;800;900&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>

:root{
  --bg:#f6f7f2; --surface:#ffffff; --surface-2:#e6efe9; --ink:#10211b; --ink-2:#3f5249; --muted:#5b6b63;
  --line:#cbd6ce; --line-2:#b4c4ba; --accent:#0f4c3a; --accent-soft:#e6efe9; --on-accent:#f2f6f1;
  --good:#0a8a0a; --warn:#b77900; --crit:#c73232;
  --c-career:#2a78d6; --c-ventures:#eb6834; --c-content:#1baf7a; --c-job:#eda100; --c-family:#e87ba4;
  --c-health:#008300; --c-agent:#56606e; --c-coaching:#6250d6; --c-other:#a3a8b0; --c-core:#14161a;
  /* area inks: >=4.5:1 on --surface-2 (the core disc) and --surface */
  --k-career:#2467b9; --k-ventures:#b64112; --k-content:#127652; --k-job:#8c5f00; --k-family:#c2225e;
  --k-health:#007900; --k-agent:#56606e; --k-coaching:#6250d6; --k-other:#626872; --k-core:#14161a;
  --f-display:"League Spartan", "Manrope", system-ui, sans-serif;
  --f-body:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1512; --surface:#16211c; --surface-2:#1e2c26; --ink:#edf2ee; --ink-2:#c4d2ca; --muted:#9db0a6;
  --line:#2a3a32; --line-2:#3a4d43; --accent:#9cc4b2; --accent-soft:#17302a; --on-accent:#0e1512;
  --good:#2fbf2f; --warn:#f0b43a; --crit:#ec6a6a;
  --c-career:#3987e5; --c-ventures:#d95926; --c-content:#199e70; --c-job:#c98500; --c-family:#d55181;
  --c-health:#2a9a2a; --c-agent:#8e97a6; --c-coaching:#9085e9; --c-other:#5d636c; --c-core:#eceef2;
  --k-career:#5095e8; --k-ventures:#e0774d; --k-content:#1aa776; --k-job:#c98500; --k-family:#dd7299;
  --k-health:#2eaa2e; --k-agent:#8e97a6; --k-coaching:#9489ea; --k-other:#8d939d; --k-core:#eceef2;
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0e1512; --surface:#16211c; --surface-2:#1e2c26; --ink:#edf2ee; --ink-2:#c4d2ca; --muted:#9db0a6;
  --line:#2a3a32; --line-2:#3a4d43; --accent:#9cc4b2; --accent-soft:#17302a; --on-accent:#0e1512;
  --good:#2fbf2f; --warn:#f0b43a; --crit:#ec6a6a;
  --c-career:#3987e5; --c-ventures:#d95926; --c-content:#199e70; --c-job:#c98500; --c-family:#d55181;
  --c-health:#2a9a2a; --c-agent:#8e97a6; --c-coaching:#9085e9; --c-other:#5d636c; --c-core:#eceef2;
  --k-career:#5095e8; --k-ventures:#e0774d; --k-content:#1aa776; --k-job:#c98500; --k-family:#dd7299;
  --k-health:#2eaa2e; --k-agent:#8e97a6; --k-coaching:#9489ea; --k-other:#8d939d; --k-core:#eceef2;
  color-scheme:dark; }

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono);font-size:.86em}
.muted{color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* masthead */
header.mast{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:color-mix(in oklab,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.mast .wrap{display:flex;align-items:center;gap:16px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font-size:22px;font-weight:800}
.brand .asof{font-size:12px;color:var(--muted)}
nav.tabs{margin-left:auto;display:flex;gap:4px;background:var(--surface-2);padding:3px;border-radius:999px}
nav.tabs a{text-decoration:none;color:var(--ink-2);font-weight:600;font-size:14px;padding:6px 14px;border-radius:999px}
nav.tabs a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

main{padding-block:24px 64px}
section.view{display:flex;flex-direction:column;gap:28px}
.lede{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 32px;justify-content:space-between}
.lede h2{font-size:clamp(26px,3.4vw,38px);font-weight:700;max-width:22ch;line-height:1.08}
.lede p{margin:6px 0 0;color:var(--ink-2);max-width:62ch}
.stats{display:flex;flex-wrap:wrap;gap:8px 28px}
.stat{display:flex;flex-direction:column}
.stat b{font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1}
.stat span{font-size:12px;color:var(--muted)}
.stat.flag b{color:var(--crit)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.sec-h h3{font-size:20px;font-weight:700}
.sec-h p{margin:0;color:var(--muted);font-size:13px}

/* legend */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink-2)}
.legend .k{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.sw.circle{border-radius:50%}
.sw.sq{border-radius:2px}

/* brain */
.brain-grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
.mapbox{padding:12px;position:relative}
.mapbox svg{width:100%;height:auto;display:block}
.mapbox .hint{position:absolute;left:16px;bottom:12px;font-size:12px;color:var(--muted)}
svg text{font-family:var(--f-body)}
.node{cursor:pointer}
.node .dot{transition:r .15s}
.node:hover .dot,.node:focus .dot{stroke:var(--ink);stroke-width:2}
.node.sel .dot{stroke:var(--accent);stroke-width:3}
.node .lbl{fill:var(--ink-2);font-size:14px}
.node.sel .lbl,.node:hover .lbl{fill:var(--ink);font-weight:600}
.node.dim{opacity:.22}
.edge{fill:none;stroke:var(--line-2);stroke-width:1}
.edge.hot{stroke:var(--accent);stroke-width:1.8}
.edge.gap{stroke:var(--crit);stroke-dasharray:4 4;stroke-width:1.6}
.edge.feed{stroke:var(--accent);stroke-width:1.6;opacity:.45}
.edge.feed.hot{stroke:var(--accent);stroke-width:4;stroke-linecap:round;opacity:1}
.edge.compete{stroke:var(--warn);stroke-width:1.8;stroke-dasharray:2 5;stroke-linecap:round;opacity:.55}
.edge.compete.hot{stroke:var(--warn);stroke-width:3.6;stroke-dasharray:2 7;opacity:1}
.node.goal .lbl{font-weight:700}
.node.profile .lbl{fill:var(--ink);font-family:var(--f-display);font-weight:800}
.goal-ph{fill:none;stroke:var(--crit);stroke-width:1.5;stroke-dasharray:3 2}
.lobe-arc{fill:none;stroke-width:6;stroke-linecap:round}
.lobe-lbl{font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}

.panel{padding:20px;position:sticky;top:76px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel .kind{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip.st-empty,.chip.st-stale{background:color-mix(in oklab,var(--crit) 14%,var(--surface));color:var(--crit)}
.chip.st-live{background:color-mix(in oklab,var(--good) 14%,var(--surface));color:var(--good)}
.panel h3{font-size:24px}
.panel ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.panel .blk h4{margin:0 0 6px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.story{display:flex;flex-direction:column;gap:6px}
.story h4{margin:0;font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:700}
.story.feed h4{color:var(--accent)} .story.compete h4{color:var(--warn)} .story.missing h4{color:var(--crit)}
.story .it{display:flex;gap:10px;align-items:baseline;font-size:14px}
.story .it i{flex:none;width:14px;display:inline-block;transform:translateY(-3px)}
.story.feed .it i{border-top:3px solid var(--accent)} .story.compete .it i{border-top:3px dotted var(--warn)} .story.missing .it i{border-top:2px dashed var(--crit)}
.suggest{background:var(--accent-soft);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.suggest .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.suggest .tag{font-size:10px;letter-spacing:.1em;font-weight:700;color:var(--on-accent);background:var(--accent);border-radius:4px;padding:2px 6px}
.suggest .by{font-size:12px;color:var(--ink-2)}
.suggest p{margin:0;font-size:14px;color:var(--ink)}
.suggest .acts{display:flex;gap:8px;flex-wrap:wrap}
.suggest .acts .btn{min-height:44px}
.links{display:flex;flex-wrap:wrap;gap:6px}
.links button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12.5px;cursor:pointer}
.links button:hover{border-color:var(--accent);color:var(--accent)}

.filebook{columns:4 260px;column-gap:14px}
.filebook>.lobe-card{break-inside:avoid;margin-bottom:14px}
.lobe-card{padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.lobe-card header{display:flex;align-items:center;gap:8px}
.lobe-card header h4{margin:0;font-size:14px;font-weight:700}
.lobe-card header .n{margin-left:auto;font-size:12px;color:var(--muted)}
.frow{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.frow:hover .fname{color:var(--accent)}
.frow .sw{margin-top:6px}
.frow .fname{font-weight:600;font-size:13.5px}
.frow .fsum{font-size:12.5px;color:var(--muted);display:block}

/* month */
.month-top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
.weeks{padding:18px}
.wk{display:grid;grid-template-columns:96px minmax(0,1fr) 54px;align-items:center;gap:10px;margin-top:10px}
.wk .wl{font-size:12.5px;color:var(--ink-2)}
.wk .wl small{display:block;color:var(--muted);font-size:11px}
.wk .bar{display:flex;height:22px;gap:2px;min-width:0}
.wk .seg{height:100%;border-radius:2px;min-width:2px;cursor:default}
.wk .seg:first-child{border-radius:4px 2px 2px 4px}
.wk .seg:last-child{border-radius:2px 4px 4px 2px}
.wk .seg:hover,.wk .seg:focus{filter:brightness(1.12);outline:2px solid var(--ink);outline-offset:1px}
.wk .tot{font-size:12.5px;text-align:right;color:var(--ink-2)}
.axis{display:grid;grid-template-columns:96px minmax(0,1fr) 54px;gap:10px;margin-top:6px}
.axis .ticks{position:relative;height:16px;font-size:10.5px;color:var(--muted)}
.axis .ticks span{position:absolute;transform:translateX(-50%)}
.flags{padding:18px;display:flex;flex-direction:column;gap:10px}
.flag-row{display:flex;gap:10px;align-items:flex-start;font-size:13.5px}
.flag-row .ic{flex:none;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff}
.ic.crit{background:var(--crit)} .ic.warn{background:var(--warn)} .ic.info{background:var(--accent);color:var(--on-accent)} .ic.good{background:var(--good)}
.flag-row b{font-weight:600}
.flag-row .d{color:var(--muted);font-size:12px;display:block}

.cal{overflow:hidden}
.cal-head,.cal-row{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-head div{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 10px 6px;font-weight:600}
.cal-row{border-top:1px solid var(--line)}
.day{min-height:140px;padding:6px 6px 8px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:3px;min-width:0;cursor:pointer;background:none;border-top:0;border-right:0;border-bottom:0;text-align:left}
.day:first-child{border-left:0}
.day.out{background:repeating-linear-gradient(135deg,transparent 0 6px,color-mix(in oklab,var(--line) 45%,transparent) 6px 7px);cursor:default}
.day.out .dn{color:var(--muted)}
.day.today .dn b{background:var(--accent);color:var(--on-accent);border-radius:999px;padding:0 6px}
.day.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.day .dn{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink-2)}
.day .dn b{font-weight:700;color:var(--ink)}
.day .load{font-size:10.5px;color:var(--muted)}
.day.heavy .load{color:var(--crit);font-weight:700}
.away{font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:4px;background:color-mix(in oklab,var(--c-ventures) 18%,var(--surface));color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.away.leisure{background:color-mix(in oklab,var(--c-health) 16%,var(--surface))}
.ev{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word;font-size:11.5px;line-height:1.25;padding:2px 5px 2px 4px;border-radius:4px;background:color-mix(in oklab,var(--c) 13%,var(--surface));border-left:3px solid var(--c);min-width:0}
.ev .t{font-family:var(--f-mono);font-size:10px;color:var(--ink-2);margin-right:4px}
.agenda .ev{display:block}
.ev .n{min-width:0}
.ev.ghost{background:transparent;border:1px dashed var(--crit);border-left:3px dashed var(--crit)}
.ev.ghost .n{color:var(--crit);font-weight:600}
.ev.clash{box-shadow:inset 0 0 0 1px var(--crit)}
.more{font-size:11px;color:var(--muted);padding-left:4px}
.daydetail{padding:18px;display:flex;flex-direction:column;gap:10px}
.daydetail h4{margin:0;font-family:var(--f-display);font-size:20px}
.dlist{display:flex;flex-direction:column;gap:6px}
.dl{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;font-size:13.5px;padding:6px 0;border-top:1px solid var(--line)}
.dl .tm{font-family:var(--f-mono);font-size:12px;color:var(--ink-2)}
.dl .ti{display:flex;gap:8px;align-items:baseline;min-width:0}
.dl .ti .tx{min-width:0;display:flex;flex-direction:column}
.dl .ti span.c{color:var(--muted);font-size:12px}
.cal-wrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.agenda{display:none}

/* plan */
.read{padding:22px 24px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px;border-left:6px solid var(--accent)}
.read p{margin:0;font-size:16.5px;max-width:72ch}
.read p.big{font-family:var(--f-display);font-size:clamp(20px,2.4vw,26px);font-weight:600;line-height:1.25;max-width:40ch}
table.g{width:100%;border-collapse:collapse;font-size:14px}
table.g th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line-2);font-weight:600}
table.g td{padding:12px;border-bottom:1px solid var(--line);vertical-align:top}
table.g td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.g td .sub{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.tbl{overflow-x:auto}
.v{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.v::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.v.starved{color:var(--crit);background:color-mix(in oklab,var(--crit) 12%,var(--surface))}
.v.thin{color:var(--warn);background:color-mix(in oklab,var(--warn) 14%,var(--surface))}
.v.fed{color:var(--good);background:color-mix(in oklab,var(--good) 12%,var(--surface))}
.v.heavy{color:var(--accent);background:var(--accent-soft)}
.v.parked{color:var(--muted);background:var(--surface-2)}
.minibar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;min-width:80px}
.minibar i{display:block;height:100%;border-radius:4px}

.moves{display:flex;flex-direction:column}
.move{display:grid;grid-template-columns:130px minmax(0,1fr) auto;gap:14px;padding:14px 18px;border-top:1px solid var(--line);align-items:start}
.move:first-child{border-top:0}
.move .when{font-family:var(--f-mono);font-size:12.5px;color:var(--ink-2);padding-top:2px}
.move .what b{display:block;font-size:15px;margin-bottom:2px}
.move .what span{color:var(--ink-2);font-size:13.5px}
.move .tag{justify-self:end;align-self:start}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:4px;white-space:nowrap}
.tag.cut{background:color-mix(in oklab,var(--crit) 12%,var(--surface));color:var(--crit)}
.tag.add{background:color-mix(in oklab,var(--good) 12%,var(--surface));color:var(--good)}
.tag.move{background:var(--accent-soft);color:var(--accent)}
.tag.decide{background:color-mix(in oklab,var(--warn) 16%,var(--surface));color:var(--warn)}

.weekplan{padding:16px;overflow-x:auto}
.wp{display:grid;grid-template-columns:44px repeat(7,minmax(92px,1fr));min-width:720px;position:relative}
.wp .hd{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:0 6px 8px}
.wp .hr{font-family:var(--f-mono);font-size:10px;color:var(--muted);text-align:right;padding-right:6px;transform:translateY(-6px)}
.wp .col{position:relative;border-left:1px solid var(--line)}
.wp .blk{position:absolute;left:3px;right:3px;border-radius:5px;padding:3px 6px;font-size:11px;line-height:1.2;overflow:hidden;background:color-mix(in oklab,var(--c) 16%,var(--surface));border-left:3px solid var(--c);color:var(--ink)}
.wp .blk b{display:block;font-weight:700;font-size:11px}
.wp .blk i{font-style:normal;color:var(--ink-2);font-family:var(--f-mono);font-size:9.5px}
.wp .blk.new{box-shadow:inset 0 0 0 1.5px var(--c)}
.wp .gridline{position:absolute;left:0;right:0;border-top:1px dashed color-mix(in oklab,var(--line) 70%,transparent)}

.agents{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.agent{padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.agent .top{display:flex;align-items:center;gap:10px}
.agent .glyph{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-weight:800;font-size:15px;flex:none}
.agent h4{margin:0;font-family:var(--f-display);font-size:18px}
.agent .when{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.agent p{margin:0;font-size:13.5px;color:var(--ink-2)}
.agent dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;font-size:13px}
.agent dt{color:var(--muted);font-size:11px;letter-spacing:.07em;text-transform:uppercase;padding-top:2px}
.agent dd{margin:0}
.agent .pri{margin-left:auto}
.fixlist{padding:6px 18px}
.fix{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.fix:first-child{border-top:0}

/* scheduled-task status, as the viewer. Only when a helper task exists (W.runner or W.builder);
   with neither, the page never calls for scheduled tasks at all. */
const REMOTE='Claude Code Remote';
const hasHelper=()=>!!(W.runner||W.builder);
function remote(tool,input){ if(!hasHelper()||!WS.mcp) return Promise.reject({code:'not_granted'}); return WS.mcp.callTool(REMOTE,tool,input); }
function parsePayload(res){ let p=res&&res.payload;
  if(typeof p==='string'){ const i=p.indexOf('{'), j=p.lastIndexOf('}'); try{ p=JSON.parse(p.slice(i,j+1)); }catch(e){ p=null; } }
  return p||null; }
function parseTrig(res){ const p=parsePayload(res); if(!p) return null; if(Array.isArray(p)) return p; if(Array.isArray(p.data)) return p.data; if(Array.isArray(p.triggers)) return p.triggers; return null; }
const TRIG={on:null, off:null};
function mergeTrig(){ if(TRIG.on===null && TRIG.off===null) return; WS.triggers=[...(TRIG.on||[]), ...(TRIG.off||[])]; }
async function moreTrig(first, input){ let p=parsePayload(first); let all=parseTrig(first)||[]; let guard=0;
  while(p && p.has_more && p.next_cursor && guard++<5){ const r=await remote('list_triggers',Object.assign({},input,{cursor:p.next_cursor})); all=all.concat(parseTrig(r)||[]); p=parsePayload(r); }
  return all; }
const unTrig=[];
function watchTriggers(){ if(unTrig.length||!WS.mcp||!hasHelper()) return;
  [['on',{limit:100,enabled:true}],['off',{limit:100,enabled:false}]].forEach(([k,input])=>{
    unTrig.push(WS.mcp.watchTool(REMOTE,'list_triggers',input, async ev=>{
      if(ev.type==='data'){ let a=parseTrig(ev.result); const p=parsePayload(ev.result);
        if(a && p && p.has_more){ try{ a=await moreTrig(ev.result,input); }catch(e){} }
        if(a){ TRIG[k]=a; mergeTrig(); WS.trigErr=null; } }
      else { WS.trigErr=ev.error; if(['not_in_manifest','needs_reauth','server_not_connected','blocked_by_policy','not_granted'].includes(ev.error&&ev.error.code)){ TRIG[k]=null; WS.triggers=null; } }
      wsEmit(); }, {refetchInterval:60000})); }); }
async function checkTriggers(){ try{ for(const [k,input] of [['on',{limit:100,enabled:true}],['off',{limit:100,enabled:false}]]){ const r=await remote('list_triggers',input); TRIG[k]=await moreTrig(r,input); } mergeTrig(); WS.trigErr=null; }catch(e){ WS.trigErr=e; } wsEmit(); }
const refreshTrig=()=>{ if(WS.mcp&&hasHelper()) WS.mcp.invalidate(REMOTE,'list_triggers').catch(()=>{}); };

const AUI={}; const aui=id=>AUI[id]||(AUI[id]={});
function fillAgentActions(box,id,compact,hooks={}){
  box.innerHTML=''; const a=CAT[id]; const st=agentState(id); const u=aui(id);
  const note=(t,cls='')=>h('span',{class:'note '+cls},t);
  if(!compact) ap(box,stChip(st));
  if(WS.phase==='loading'){ ap(box,note('Connecting…')); return; }
  if(WS.phase!=='on'){ ap(box,note(WS.phase==='notowner'?'Only the owner can build agents.':'Open this page in Claude, signed in, to build agents.')); return; }
  const run=async(fn,ok)=>{ u.busy=true; u.msg=''; u.err=false; wsEmit();
    try{ await fn(); u.msg=ok||''; }catch(e){ u.err=true; u.msg=errText(e); }
    u.busy=false; u.confirm=false; wsEmit(); };
  if(compact) box.classList.toggle('wide', !!u.confirm);
  if(u.confirm){
    ap(box,h('div',{class:'confirm'},
      h('span',{},`Creates the scheduled task “${a.task}”, ${a.runs.charAt(0).toLowerCase()+a.runs.slice(1)}. It reads your mail, calendar and ⟦A⟧ files and reports here and in your memo. It never sends email or spends money. Its first run starts once it's built.`),
      h('div',{class:'row'},
        h('button',{class:'btn primary sm',type:'button',disabled:u.busy,onclick:()=>run(async()=>{ await buildAgent(id); if(hooks.onBuilt) await hooks.onBuilt(); },'')}, u.busy?'Starting…':'Build it'),
        h('button',{class:'btn ghost sm',type:'button',disabled:u.busy,onclick:()=>{ u.confirm=false; wsEmit(); }},'Cancel'))));
    return; }
  const noMcp=!WS.mcp;
  const buildBtn=label=>h('button',{class:(compact?'btn sm':'btn primary sm'),type:'button',disabled:noMcp||u.busy,onclick:()=>{ u.confirm=true; u.msg=''; u.err=false; wsEmit(); }},label);
  if(compact) ap(box,stChip(st));
  if(st.s==='none'||st.s==='failed'){
    ap(box,W.builder? buildBtn(st.s==='failed'?'Try again':compact?'Build':'Build this agent') : null,
      compact? null : h('button',{class:'btn ghost sm',type:'button',disabled:u.busy,onclick:()=>run(async()=>{ await dismissAgent(id); if(hooks.onDismissed) await hooks.onDismissed(); },'')},'Not interested'));
    if(noMcp && !compact) ap(box,note('Allow connectors for this page to build from here.'));
    else if(st.s==='failed' && !u.msg) ap(box,note(st.d.error||'The build did not start.','err'));
  } else if(st.s==='building'){
    if(!compact||st.slow) ap(box,note(st.slow?'Not showing yet after 20 minutes.':'Being built now. Usually a few minutes.'));
    if(st.slow&&W.builder) ap(box,buildBtn('Try again'));
  } else if(st.s==='live'){
    if(st.tid && !noMcp && !compact) ap(box,h('button',{class:'btn sm',type:'button',disabled:u.busy,onclick:()=>run(()=>setEnabled(st,false),'Paused. Nothing runs until you resume.')},'Pause'));
    if(!compact) ap(box,note('Reports here and in your Morning Memo.'));
  } else if(st.s==='paused'){
    ap(box,h('button',{class:'btn primary sm',type:'button',disabled:u.busy||noMcp,onclick:()=>run(()=>setEnabled(st,true),'Running again.')},'Resume'));
  } else if(st.s==='hidden'){
    ap(box,h('button',{class:'btn sm',type:'button',disabled:u.busy,onclick:()=>run(()=>restoreAgent(id),'')},'Bring back'));
    if(!compact) ap(box,note("Hidden. ⟦A⟧ won't suggest it again."));
  }
  if(u.msg) ap(box,note(u.msg,u.err?'err':'ok'));
  if(compact) box.classList.toggle('wide', !!u.msg || (st.s==='building'&&st.slow));
}

  const setMsg=(t,cls='')=>{ msg.textContent=t||''; msg.className='em-msg '+cls; };
  async function save(){ if(st.saving){ st.again=true; return; } st.saving=true; st.dirty=false; const v=read();

        if(!v.body.trim()) return setMsg('The email is empty.','err');

      WS.sample? h('button',{class:'btn',type:'button',disabled:st.busy,'aria-expanded':String(!rvBox.hidden),onclick:()=>{ rvBox.hidden=!rvBox.hidden; renderActions(); if(!rvBox.hidden) rvIn.focus(); }},'Revise') : null,
      h('span',{class:'sp'}),

  function composeUrl(v){ const e=encodeURIComponent; if(CFG().mail==='outlook') return 'https://outlook.office.com/mail/deeplink/compose?to='+e(v.to.join(';'))+(v.cc.length?'&cc='+e(v.cc.join(';')):'')+'&subject='+e(v.subject||'')+'&body='+e(v.body||'');

  async function copyIt(){ const v=read(); try{ await navigator.clipboard.writeText(v.body); setMsg('Copied.','ok'); }catch(err){ body.select(); setMsg('Press copy on your keyboard.'); } }

      .forEach(t=>WS.db.doc('todos/'+t.id).update({status:'done', doneAt:nowIso(), doneBy:'sent', updatedAt:nowIso()}).catch(()=>{}));
    st.busy=false; setTimeout(()=>{ SENT_LOCAL.delete(id); wsEmit(); },2500); }
  async function markSent(){ if(st.busy) return; st.busy=true; const v=read(); SENT_LOCAL.add(id); clearTimeout(st.timer); renderActions(); await afterSent(v,{threadId:st.data.threadId||null},null); }

    const input={to:v.to, subject:v.subject, body:v.body}; if(v.cc.length) input.cc=v.cc;

    SENT_LOCAL.add(id); clearTimeout(st.timer);
    const p=res&&res.payload; const mid=p&&typeof p==='object'? (p.id||null) : null;

  async function skip(){ if(st.busy) return; st.busy=true; renderActions();
    try{ await WS.db.doc('emails/'+id).update({status:'skipped', skippedAt:nowIso()}); logDecision('email','skipped',{to:asList(st.data.to)[0]||'', subject:st.data.subject||'', from:st.data.from||'', emailKind:st.data.kind||''}); }catch(err){ setMsg(errText(err),'err'); }
    st.busy=false; renderActions(); }
  async function revise(instr){ instr=(instr||'').trim()||'Tighten it.'; if(st.busy||!WS.sample) return;
    st.busy=true; renderActions(); const v=read(); const before=v.body; setMsg('Claude is revising…');
    const prompt=['You are revising an email that '+userName()+' will send from their own mail. Return only the new email body as plain text: no subject line, no notes, no quotation marks around it.',
      'Their voice: '+(CFG().voice||'Short, plain and direct.'),
      'Keep every fact exactly as given. Never add a fact, date, time, name, number or promise that is not in the draft or the instruction.',
      'Instruction: '+instr,'To: '+v.to.join(', '),'Subject: '+v.subject,'Current draft:','"""',before,'"""'].join('\n');

  {rx:/^Morning Memo$/, does:'Emails you a summary of your day every morning.', fix:'06:00'},
  {rx:/^Evening Debrief$/, does:"Emails you tomorrow's reminders every evening.", fix:'20:00'},

  {rx:/^Friday 1:1$/, does:'Starts a weekly check-in chat with your assistant.'},

  {rx:/^Heartbeat$/, does:"Checks your mail and calendar 5 times a day and flags what's coming up.", tag:'Built into Claude'},
  {rx:/^Desk · Agent Builder$/, does:'Sets up an agent when you click Build. Never runs on its own.', builder:true},
  {rx:/^Desk · Task Runner$/, does:'Does the job when you tap a ✦ button on a to-do. Never runs on its own.', runner:true},
];
const RETIRED_CAT=[];
const dispName=n=>n.replace(/^Desk · /,'');
const infoOf=t=>TASK_INFO.find(i=>i.rx.test(t.name))||{};
const catOfTask=t=>Object.values(CAT).find(a=>a.task===t.name);
const DOWN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function cronInfo(c){ if(!c) return null; let tz='UTC', e=c; const m=c.match(/^CRON_TZ=(\S+)\s+(.*)$/); if(m){ tz=m[1]; e=m[2]; }
  const f=e.trim().split(/\s+/); if(f.length<5) return null; const [mi,hr,,,dw]=f; const now=new Date(Date.now()+2*864e5);
  const times=hr.split(',').map(Number).map(H=>{ let lh=H, lm=+mi, shift=0;
    if(tz!==TZ){ const d=new Date(Date.UTC(now.getUTCFullYear(),now.getUTCMonth(),now.getUTCDate(),H,+mi));
      const parts=Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:TZ,hour:'numeric',minute:'2-digit',hour12:false,day:'numeric'}).formatToParts(d).map(p=>[p.type,p.value]));
      lh=(+parts.hour)%24; lm=+parts.minute; shift=(+parts.day)!==d.getUTCDate()?-1:0; }
    return {h:lh,m:lm,shift}; });
  return {tz, mi, hr, dw, times}; }
const fmtHM=(h,m)=>{ const ap=h>=12?'pm':'am'; const hh=h%12||12; return m?`${hh}:${String(m).padStart(2,'0')}${ap}`:`${hh}${ap}`; };
function dowText(dw,shift){ if(dw==='*') return 'Daily'; const set=new Set();
  dw.split(',').forEach(p=>{ const r=p.split('-').map(Number); if(r.length===2){ for(let i=r[0];i<=r[1];i++) set.add(i); } else set.add(r[0]); });
  const days=[...set].map(d=>((d+shift)%7+7)%7).sort((a,b)=>a-b); const k=days.join(',');
  if(k==='1,2,3,4,5') return 'Weekdays'; if(k==='0,1,2,3,4,5') return 'Sun to Fri';
  if(days.length===1) return ['Sundays','Mondays','Tuesdays','Wednesdays','Thursdays','Fridays','Saturdays'][days[0]]; return days.map(d=>DOWN[d]).join(', '); }
function schedText(t){ const ci=cronInfo(t.cron_expression||''); if(!ci) return /Task Runner/.test(t.name||'')? 'Runs when you tap ✦' : 'Runs only when you click Build';
  const sh=ci.times[0].shift; const days=dowText(ci.dw,sh);
  ci.times.sort((a,b)=>a.h*60+a.m-(b.h*60+b.m));
  if(ci.times.length>2) return `${ci.times.length} times a day, ${fmtHM(ci.times[0].h,ci.times[0].m)} to ${fmtHM(ci.times[ci.times.length-1].h,ci.times[ci.times.length-1].m)}`;
  return `${days} ${ci.times.map(x=>fmtHM(x.h,x.m)).join(' and ')}`; }
function driftOf(t){ const inf=infoOf(t); if(!inf.fix) return null; const ci=cronInfo(t.cron_expression||''); if(!ci||ci.tz===TZ||ci.times.length!==1) return null;
  const [fh,fm]=inf.fix.split(':').map(Number); const x=ci.times[0]; if(x.h===fh&&x.m===fm) return null;
  const dw=ci.dw==='*'?'*':dowText(ci.dw,x.shift)==='Fridays'?'5':ci.dw;
  return {now:fmtHM(x.h,x.m), want:fmtHM(fh,fm), cron:`CRON_TZ=${TZ} ${fm} ${fh} * * ${dw}`}; }
function lastRunText(t){ const r=t.last_run; if(!r||!r.fired_at) return {t:'Not run yet', bad:false};
  const d=new Date(r.fired_at); const when=d.toLocaleDateString([], {weekday:'short',month:'short',day:'numeric'})+', '+d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}).replace(/\s/g,'').toLowerCase();
  const st=String(r.status||''); if(/FAILED/.test(st)) return {t:'Last run failed '+when, bad:true}; if(/PENDING|RUNNING/.test(st)) return {t:'Running now', bad:false};
  return {t:'Last ran '+when, bad:false}; }
const TUI={};
async function tRun(key,fn,ok){ const u=TUI[key]||(TUI[key]={}); if(u.busy) return; u.busy=true; u.msg=''; u.err=false; wsEmit();
  try{ await fn(); u.msg=ok||''; }catch(e){ u.err=true; u.msg=errText(e); } u.busy=false; u.confirm=null; wsEmit(); }
async function setTask(t,patch){ await remote('update_trigger',Object.assign({trigger_id:t.id},patch));
  if(WS.triggers) WS.triggers=WS.triggers.map(x=>x.id===t.id? Object.assign({},x,patch) : x);
  ['on','off'].forEach(k=>{ if(TRIG[k]) TRIG[k]=TRIG[k].filter(x=>x.id!==t.id); }); const nt=Object.assign({},t,patch); (nt.enabled?(TRIG.on=TRIG.on||[]):(TRIG.off=TRIG.off||[])).push(nt); mergeTrig();
  refreshTrig(); }

  function draw(){ // with no builder and no live agents there is nothing to show or build: hide the section

  WS.subs.add(draw); draw();
  return sec;
}

const TODO_CATS=['Captured','Goal','Top 3','Waiting','Travel','Work','Family','Health','Admin','Home & Finance','Unresolved'];
const RUNNER_KINDS=new Set(['draft','move-draft','options','research','ask','flights']);
const TUI2={}; let todoFilter=(()=>{ try{ return localStorage.getItem('jz-todo-filter')||'all'; }catch(e){ return 'all'; } })();
const catOf=t=>t.waiting? 'Waiting' : t.category;
const isoToday=()=>{ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const daysTo=ds=>{ if(!ds) return null; const a=new Date(isoToday()+'T12:00:00'), b=new Date(ds+'T12:00:00'); return Math.round((b-a)/864e5); };
function canAct(t){ const a=t.action; if(!a) return false; return a.kind!=='link' && a.kind!=='goto'; }
async function patchTodo(id,data){ await WS.db.doc('todos/'+id).update(Object.assign({updatedAt:nowIso()},data)); }
async function runTodo(t){ const a=t.action;
  if(RUNNER_KINDS.has(a.kind)&&!W.runner) return;
  if(RUNNER_KINDS.has(a.kind)){
    await patchTodo(t.id,{run:{status:'requested',at:nowIso(),action:a.kind,label:a.label}});
    try{ await remote('fire_trigger',{trigger_id:W.runner, text:JSON.stringify({todo:t.id, ledger:t.ledger||[], title:t.title, detail:t.detail||'', action:a.kind, label:a.label, instruction:a.instruction||'', notes:(t.notes||[]).map(n=>n.text)})}); }
    catch(e){ await patchTodo(t.id,{run:{status:'failed',at:nowIso(),action:a.kind,label:a.label,summary:"Couldn't start: "+errText(e)}}).catch(()=>{}); throw e; }
    return; }
  if(a.kind==='calendar'&&!calNative()){ const url=calLink({event:a.event}); await patchTodo(t.id,{run:{status:'done',at:nowIso(),action:a.kind,label:a.label,summary:'Add this one yourself: '+a.event.summary+'.',links:url?[{title:'Open in Outlook',url}]:[]}}); return; }
  if(a.kind==='calendar'){ const r=await WS.mcp.callTool('Google Calendar','create_event',calInput(a.event));
    const p=(r&&r.payload&&typeof r.payload==='object')?r.payload:{};
    await patchTodo(t.id,{run:{status:'done',at:nowIso(),action:a.kind,label:a.label,summary:'Added to your calendar: '+a.event.summary+'.',links:p.htmlLink?[{title:'Open event',url:p.htmlLink}]:[]}}); return; }
  if(a.kind==='fix'){ const done=[];
    for(const c of a.changes){ await remote('update_trigger',{trigger_id:c.id, cron_expression:c.cron}); done.push(c.name); }
    refreshTrig();
    await patchTodo(t.id,{run:{status:'done',at:nowIso(),action:a.kind,label:a.label,summary:'Set to your local time: '+done.map(n=>n.replace(/^The Desk - (\w+)/,'$1 Desk')).join(', ')+'. They stay put when clocks change.'}}); return; }
}
const md=ds=>new Date(ds+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});
function gotoEmail(id){ location.hash='#today'; setTimeout(()=>{ const el=document.getElementById('em-'+id); if(el){ el.scrollIntoView({behavior:'smooth',block:'start'}); el.classList.add('flash'); setTimeout(()=>el.classList.remove('flash'),1800); } },350); }
const emailOf=id=>(WS.emails||[]).find(e=>e.id===id)||null;
function cronClock(c){ const m=String(c||'').replace(/^CRON_TZ=\S+\s+/,'').split(/\s+/); const mi=+m[0], hr=+m[1]; if(isNaN(mi)||isNaN(hr)) return '';
  return (hr%12||12)+(mi?':'+String(mi).padStart(2,'0'):'')+(hr<12?'am':'pm'); }

        else if(a.kind==='fix'&&!hasHelper()){ /* no helper task: scheduled tasks are not reachable from here */ }
        else right.append(h('button',{type:'button',class:'btn sm act',disabled:!can||busy||!WS.mcp,onclick:()=>{ if(needsConfirm){ u.confirm=true; update(); } else go(); }},h('span',{class:'spark','aria-hidden':'true'},'✦'),(run&&run.status==='done'&&RUNNER_KINDS.has(a.kind))?'Run again':a.label));
        async function go(){ u.busy=true; u.confirm=false; u.msg=''; u.err=false; update(); try{ await runTodo(t); }catch(e){ u.err=true; u.msg=errText(e); } u.busy=false; update(); }
      }
    }
    ap(row,check,main,right); return row; }
  function notesBox(t,u){ const notes=Array.isArray(t.notes)? t.notes : [];
    const box=h('div',{class:'tdnotes'});
    notes.forEach(n=>box.append(h('div',{class:'tdnote'},h('span',{},n.text),h('span',{class:'nt'},fmtT(n.at)))));

    inp.value=u.draft||''; inp.addEventListener('input',()=>{ u.draft=inp.value; });
    const save=async()=>{ const text=inp.value.trim(); if(!text||u.nbusy) return; u.nbusy=true; update();
      try{ await patchTodo(t.id,{notes:notes.concat([{at:nowIso(), text}]), noteAt:nowIso()}); u.draft=''; logDecision('todo','note',{title:t.title||''}); u.nerr=''; }
      catch(e){ u.nerr=errText(e); }
      u.nbusy=false; update(); };
    inp.addEventListener('keydown',ev=>{ if(ev.key==='Enter'&&(ev.metaKey||ev.ctrlKey)){ ev.preventDefault(); save(); } });
    ap(box,inp,h('div',{class:'row'},h('button',{type:'button',class:'btn sm',disabled:u.nbusy||WS.phase!=='on',onclick:save},u.nbusy?'Saving…':'Add note'), u.nerr? h('span',{class:'em-msg err'},u.nerr):null));
    return box; }
  WS.subs.add(update); update();
}

const PROTECT_DEFAULT=[];

  function draw(){ const on=WS.phase==='on';

    pCard.innerHTML='';
    const blocks=(WS.settings.protected&&WS.settings.protected.blocks)||PROTECT_DEFAULT;
    blocks.forEach((b,i)=>{ const sw=h('button',{type:'button',role:'switch','aria-checked':String(!!b.on),class:'sw2'+(b.on?' on':''),disabled:!on,'aria-label':b.label,onclick:()=>{ const nb=blocks.map((x,j)=>j===i?Object.assign({},x,{on:!x.on}):x); saveProtect(nb); }},h('i',{}));
      ap(pCard,h('div',{class:'prow'},h('div',{},h('b',{},b.label),h('span',{class:'muted'},b.rule)),sw)); });
    if(!blocks.length) ap(pCard,h('p',{class:'ws-note',style:'padding:0'},'Time ⟦A⟧ never offers for meetings. Add your first one.'));
    { const inp=h('input',{type:'text',maxlength:'120',placeholder:'e.g. Workouts, Mon to Fri, 6 to 7am','aria-label':'Add protected time'});
      const f=h('form',{class:'padd',autocomplete:'off'},inp,h('button',{class:'btn sm',type:'submit',disabled:!on},'Add'));
      f.addEventListener('submit',ev=>{ ev.preventDefault(); const t=inp.value.trim(); if(!t) return; const m=t.match(/^([^,]+),\s*(.+)$/); saveProtect(blocks.concat([{id:'p'+Date.now(),label:m?m[1]:t,rule:m?m[2]:'',on:true}])); });
      ap(pCard,f); }
    if(SUI.p&&SUI.p.err) ap(pCard,h('div',{class:'em-msg err'},SUI.p.err));
    rCard.innerHTML='';
    const rules=(WS.settings.rules&&WS.settings.rules.rules)||[];
    if(!rules.length) ap(rCard,h('p',{class:'ws-note',style:'padding:0'},'None yet. ⟦A⟧ suggests one after you make the same call 3 times.'));
    rules.forEach((r,i)=>ap(rCard,h('div',{class:'prow'},h('span',{},r.text),h('button',{class:'linkbtn',type:'button',disabled:!on,onclick:()=>saveRules(rules.filter((x,j)=>j!==i))},'Remove'))));
  }
  WS.subs.add(draw); draw();
}

/* ============ PLAN ============ */
/* ============ ROUTER ============ */
const views={today:renderToday,todos:renderTodos,brain:renderBrain,calendar:renderCalendar,plan:renderPlan};
// With no tab picked (no hash), a page fresh from setup opens on Brain until the Desk's first write-out replaces
// the setup headline. Picking any tab sets the hash, and that choice is always kept.
const defaultTab=()=>(WS.meta&&WS.meta.headline==='Set up today')? 'brain' : 'today';
function route(){ let k=(location.hash||'').slice(1)||defaultTab(); if(k==='month') k='calendar'; if(k==='desk') k='today'; if(k==='settings') k='plan'; const key=views[k]?k:defaultTab();
  Object.keys(views).forEach(n=>{ $('#v-'+n).hidden = n!==key; });
  document.querySelectorAll('nav.tabs a').forEach(a=>a.toggleAttribute('aria-current',a.dataset.v===key)); document.querySelectorAll('nav.tabs a').forEach(a=>{ if(a.dataset.v===key) a.setAttribute('aria-current','page'); });
  if(!done[key]){ views[key](); done[key]=true; } hideTip(); }
addEventListener('hashchange',()=>{ route(); scrollTo({top:0}); });
route();
})();
</script>
